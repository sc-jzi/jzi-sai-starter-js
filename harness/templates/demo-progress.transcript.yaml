# Add this block to industry-verticals/<customer>/docs/ai/demos/<customer>/demo-progress.yaml for the transcript-first flow.
# Written by demo-from-transcript; read on "resume demo".
# blockedOn: marketer-mcp-auth   # set ONLY when the run stopped for the SE (Marketer MCP not connected / the auth request timed out).
#                                 # The stop hook never restarts a blocked run; /resume-demo <customer> clears it after list_sites returns.
transcriptFlow:
  guardSnapshotTaken: false
  t0_preflight:     { status: "pending", marketerMcp: "" }       # marketerMcp: connected (list_sites returned) | blocked
  t1_intake:        { status: "pending", file: "" }              # pending | complete
  t2_brief:         { status: "pending", file: "industry-verticals/<customer>/docs/ai/demos/<customer>/demo-brief.md" }
  t2b_story:        { status: "pending", storyApproved: false }  # gate 1: the story alone, before measurement / plan / theme
  t3_plan:          { status: "pending", file: "industry-verticals/<customer>/docs/ai/demos/<customer>/demo-plan.yaml", storyValid: false, sitePlanValid: false }
  t4_approval:      { status: "pending", userApproved: false }   # gate 2: pages, theme, Sitecore (the build runs unattended after it)
  t6_verify:        { status: "pending", demoScript: false }

# One entry per planned page (replaces the single-page assumption). Updated after every create/add/wire call.
pages:
