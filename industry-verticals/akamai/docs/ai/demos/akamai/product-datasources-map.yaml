      - ["How is this different from GPU instances?", "VPUs are purpose-built for video transcoding density and efficiency; GPUs suit broader AI and parallel compute."]
      - ["Can I use Kubernetes?", "Yes — add Accelerated Compute worker nodes to managed Kubernetes clusters."]

