  - id: "{CB27BCB0-96F7-4050-82CC-6A0CD7763604}"
    slug: accelerated-compute
    name: Accelerated Compute
    url: https://www.akamai.com/products/accelerated-compute
    status: wired
    heroTitle: "Optimize media workloads with VPU-powered Accelerated Compute"
    heroText: "Scale VOD and live streaming with NETINT VPUs on Akamai Cloud — free your CPUs and cut transcoding cost."
    promo1Title: "Transcode more streams for less with dedicated VPUs"
    promo1Text: "NETINT Quadra VPUs deliver high-density encoding for AV1, HEVC, and H.264 — up to 8K HDR — while leaving CPU capacity for packaging, SSAI, and app logic."
    sectionHeading: "Built for live and on-demand media at cloud scale"
    value1: ["High stream density", "Process dozens of concurrent live streams per VPU with ASIC efficiency."]
    value2: ["Lower cost per stream", "Start from US$0.42/hour with egress as low as US$0.005 per GB."]
    value3: ["Elastic VPU capacity", "Scale 1–8 dedicated VPUs on demand with no CapEx hardware buy-in."]
    promo2Title: "Offload transcoding so your CPUs can do everything else"
    promo2Text: "Keep dynamic packaging, captioning, and orchestration on CPU while VPUs handle encode/decode at wire speed."
    icons: [["Discover", "Inventory media pipelines"], ["Encode", "Accelerate encode/decode"], ["Scale", "Right-size VPU plans"], ["Deliver", "Stream globally"]]
    splitTitle: "Introducing Accelerated Compute"
    splitRightTitle: "Get the Accelerated Compute overview"
    splitRightText: "See how VPU instances compare to CPU- and GPU-based transcoding."
    banner1Title: "Plans from 1 to 8 dedicated VPUs"
    banner1Text: "Choose the density you need for live events, VOD libraries, and UGC platforms."
    features: [["FFmpeg ready", "Use included SDKs and FFmpeg integrations out of the box."], ["HDR & modern codecs", "Native HDR with AV1, HEVC/H.265, and H.264 support."], ["Private networking", "Segment traffic with VPC, VLAN, and Cloud Firewall."]]
