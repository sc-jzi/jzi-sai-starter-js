# Component Registry (Prospera base app)
# Machine-readable index used by the Site Analyzer and validate-site-plan.mjs to match page sections to components.
# Generated from the real components in src/components (variants = named exports, fieldCount = Fields interface) on 2026-10-09.
# Keywords and variant hints were written from component and field names: refine them after seeing the components rendered.
# NOT sections (they come from Page Design partials or page types): Header, Footer, Navigation, Eyebrow, Breadcrumb, ColumnSplitter,
# ArticleDetails, AuthorDetails, ProjectDetails, PageBackground, PartialDesignDynamicPlaceholder, SiteTheme, ThemeSwitcher, LanguageSwitcher.

components:

  - id: hero-banner
    name: "HeroBanner"
    kind: simple
    category: Banners
    file: src/components/pagecontent/HeroBanner.tsx
    variants: [Default]
    visualKeywords:
      - large headline with small eyebrow tagline above
      - body text and one or two buttons
      - image beside or behind the headline
      - main intro section at the top of a page
    fieldCount: 7

  - id: hero
    name: "Hero"
    kind: simple
    category: Banners
    file: src/components/pagecontent/Hero.tsx
    variants: [Default]
    visualKeywords:
