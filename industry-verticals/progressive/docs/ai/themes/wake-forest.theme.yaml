  scale:
    hero: "3.5rem"
    h1: "2.5rem"
    h2: "2rem"
    h3: "1.75rem"
    body: "1.1875rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "spacious"
  sectionGap: "0"
  containerMaxWidth: "1200px"
  containerPadding: "1.5rem"

shape:
