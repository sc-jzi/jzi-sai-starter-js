  accent: "#9e7e38"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#222222"
  muted: "#f5f0e8"
  mutedForeground: "#5a5348"
  headerBackground: "#1a1a1a"
  headerForeground: "#ffffff"
  footerBackground: "#222222"
  footerForeground: "#d4cbb8"
  border: "#d8d0c0"
