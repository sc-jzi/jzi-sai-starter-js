  buttonRadius: "0"
  cardRadius: "0"
  imageRadius: "0"
  shadowStyle: "none"
  borderStyle: "flat"

tone:
  overall: "academic"
  colorMode: "mixed"
  contrast: "high"
  imagery: "photography"
  heroStyle: "full-bleed-image"
  cardStyle: "flat"
  navStyle: "transparent-overlay"

tailwind:
