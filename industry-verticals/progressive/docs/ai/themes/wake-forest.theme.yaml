    --brand-primary-foreground: #ffffff;
    --brand-secondary: #1a1a1a;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #9e7e38;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #222222;
    --brand-muted: #f5f0e8;
    --brand-muted-fg: #5a5348;
    --brand-header-bg: #1a1a1a;
    --brand-header-fg: #ffffff;
    --brand-footer-bg: #222222;
    --brand-footer-fg: #d4cbb8;
    --brand-border: #d8d0c0;
    --brand-ring: #8c6d2c;
    --brand-heading-font: 'Cormorant', serif;
    --brand-body-font: 'Open Sans', 'Helvetica Neue', Helvetica, sans-serif;
    --brand-radius: 0;
    --brand-button-radius: 0;
    --brand-card-radius: 0;
  }

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Wake Forest uses Cormorant serif for headings and Open Sans for body text."
