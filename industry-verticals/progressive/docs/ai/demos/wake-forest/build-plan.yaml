      manifestName: "HeroBanner"
      matchType: "template"
    - position: 3
      manifestName: "TabNavigationSection"
      matchType: "template"
    - position: 4
      manifestName: "FeatureHighlight"
      matchType: "template"
    - position: 5
      manifestName: "FeatureCardsGrid"
      matchType: "template"
    - position: 6
      manifestName: "FeatureHighlight"
      matchType: "template"
    - position: 7
      manifestName: "ValuePropositionGrid"
      matchType: "template"
    - position: 8
      manifestName: "TrustStatsRow"
      matchType: "template"
    - position: 9
      manifestName: "FeatureCardsGrid"
      matchType: "template"
    - position: 11
      manifestName: "CTABanner"
      matchType: "template"
  phase2_theme: "docs/ai/themes/wake-forest.theme.yaml"
  phase3_custom: []
