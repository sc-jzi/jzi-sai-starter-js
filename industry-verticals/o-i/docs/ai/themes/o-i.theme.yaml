# Client Brand Theme — O-I
# Extracted from Playwright scrape of https://www.o-i.com/ plus full-page screenshot.
# Primary visual source: dark glass-packaging homepage with gold CTAs.

client:
  name: "O-I"
  sourceUrl: "https://www.o-i.com/"
  extractedAt: "2026-09-21T14:20:00Z"
  extractedBy: "cursor"

colors:
  primary: "#FFD100"
  primaryForeground: "#171717"
  secondary: "#171717"
  secondaryForeground: "#ffffff"
  accent: "#FFD100"
  accentForeground: "#171717"
  background: "#171717"
  foreground: "#ffffff"
  muted: "#242424"
  mutedForeground: "#C8C8C8"
  headerBackground: "#171717"
  headerForeground: "#ffffff"
  footerBackground: "#111111"
  footerForeground: "#ffffff"
  border: "#3A3A3A"
  ring: "#FFD100"
  extra:
    - { name: "pageBlack", value: "#171717" }
    - { name: "cardBlack", value: "#1A1A1A" }
    - { name: "goldBorder", value: "#FFD100" }
    - { name: "logoWhite", value: "#FFFFFF" }
    - { name: "pillButton", value: "#FFD100" }

typography:
  headingFamily: "'Lato', 'Gill Sans', sans-serif"
  headingWeight: "600"
  bodyFamily: "'Lato', 'Gill Sans', sans-serif"
  bodyWeight: "400"
  monoFamily: "'Source Code Pro', monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap"
  scale:
    hero: "4.5rem"
    h1: "3.25rem"
    h2: "2.25rem"
    h3: "1.125rem"
    body: "1.125rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "comfortable"
  sectionGap: "5rem"
  containerMaxWidth: "1280px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0.75rem"
  buttonRadius: "9999px"
  cardRadius: "0.75rem"
  imageRadius: "0.75rem"
  shadowStyle: "none"
  borderStyle: "gold-outline"

tone:
  overall: "bold-industrial"
  colorMode: "dark"
  contrast: "high"
  imagery: "photography"
  heroStyle: "split-image-text"
  cardStyle: "image-top"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#FFD100"
      secondary: "#171717"
      accent: "#FFD100"
  fontFamily:
    heading: ["Lato", "Gill Sans", "sans-serif"]
    body: ["Lato", "Gill Sans", "sans-serif"]
  borderRadius:
    DEFAULT: "0.75rem"
    button: "9999px"
    card: "0.75rem"

cssVariables: |
  :root {
    --brand-primary: #FFD100;
    --brand-primary-foreground: #171717;
    --brand-secondary: #171717;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #FFD100;
    --brand-accent-foreground: #171717;
    --brand-bg: #171717;
    --brand-fg: #ffffff;
    --brand-muted: #242424;
    --brand-muted-fg: #C8C8C8;
    --brand-header-bg: #171717;
    --brand-header-fg: #ffffff;
    --brand-footer-bg: #111111;
    --brand-footer-fg: #ffffff;
    --brand-border: #3A3A3A;
    --brand-ring: #FFD100;
    --brand-heading-font: 'Lato', 'Gill Sans', sans-serif;
    --brand-body-font: 'Lato', 'Gill Sans', sans-serif;
    --brand-radius: 0.75rem;
    --brand-button-radius: 9999px;
    --brand-card-radius: 0.75rem;
    --brand-page-black: #171717;
    --brand-gold: #FFD100;
  }

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Playwright scrape succeeded. Computed body is rgb(23,23,23) / #171717 with white text."
    - "Primary CTA color taken from computed linkColor rgb(255,209,0) / #FFD100 and the Catalog / Read Our Story pills in the screenshot. Scraper primaryButtonBackground was the dark page color — overridden from visual + linkColor."
    - "Site uses proprietary Gill Sans webfonts. Demo substitute is Lato (400/600/700) on Google Fonts."
    - "Buttons are pills (50px computed radius). News cards use ~12px radius with a thin gold border."
    - "Header is a solid dark bar (not transparent overlay) with white logo and a gold Catalog CTA."
    - "Hero is split: 2x2 news cards on the left, stacked headline + body + gold CTA on the right."
    - "2019 logo guidelines are grayscale; the live 2026 site is dark + gold. Theme follows the live homepage, not the older print logo spec."
    - "Circle photo cluster in Guided by Our Values is a custom visual; Phase 2 will map it to the closest Financial component + a custom variant if approved."
