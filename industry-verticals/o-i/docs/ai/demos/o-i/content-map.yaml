  - position: 3
    componentName: "HeroBanner"
    manifestName: "HeroBanner"
    itemName: "OI Hero"
    templateId: "0089bcb3-0117-43f2-a760-0771d5ff7417"
    fields:
      Title: "Innovation. Transformation. Glass Packaging."
      Text: "<p>Glass is a material unlike any other, capable of creating stunning, memorable experiences, and it's the most sustainable packaging material on earth. At O-I, we have a history of transforming how the world stores food and beverages — of making glass more accessible to more customers and consumers. We reimagine how glass is made and sold by innovating production techniques, pioneering recycling and sustainable technology, and unleashing the iconic, brand-building potential of this packaging that is the kindest material for the planet and its people.</p>"
      Cta1: { text: "Read Our Story", href: "https://www.o-i.com/", linktype: "external" }

  - position: 4
    componentName: "Carousel"
    manifestName: "Carousel"
    itemName: "OI Carousel"
    templateId: "c7b8468f-4290-400f-93bb-d46c5f8db126"
    kind: "list"
    childTemplateId: "54db209d-cd0f-49d9-ae4e-ecb65d72cc4d"
    children:
      - name: "Slide 1 Vision"
        fields:
          Title: "Shaping the Future Through Glass"
          Text: "<p>OUR VISION</p><p>We create iconic, healthy glass packaging so synonymous with brands, you recognize those brands by their packaging alone, even without a label. We innovate packaging design to enable customers to meet their own ambitions, from connecting with consumers on an emotional level to creating a more sustainable future.</p>"
          Link: { text: "Learn Our Vision", href: "https://www.o-i.com/", linktype: "external" }
        imageFields:
          - field: "Image"
            src: "https://www.o-i.com/wp-content/uploads/2023/03/EVP-26-Man-Presenting-the-Bottle-5651-1024x508.webp"
            alt: "Couple with a glass bottle"
      - name: "Slide 2 Innovation"
        fields:
          Title: "Driven Through Innovation"
          Text: "<p>INNOVATION</p><p>Innovation and transformation are in our DNA. O-I Glass was founded more than a century ago by a man whose glass bottle making machine was called the most significant invention in glass in 2000 years. Founder Michael J. Owens' motto was \"It can be done.\" And we're doing it. We're reimagining what glass can do, making it the world's most versatile, charismatic and sustainable packaging material.</p>"
          Link: { text: "Learn Our Story", href: "https://www.o-i.com/", linktype: "external" }
        imageFields:
          - field: "Image"
            src: "https://www.o-i.com/wp-content/uploads/2023/04/OI-Fire-248-1.jpg"
            alt: "Molten glass furnace"
      - name: "Slide 3 Mission"
        fields:
          Title: "Our Sustainability Vision"
          Text: "<p>OUR MISSION</p><p>Glass is the ideal packaging material to support a low-waste, circular economy. But sustainability isn't just about what we make – it's also about how we make it. Sustainability is woven into everything we do, from transforming our glass-making technology and processes to our customer approach to how we engage our employees and support our communities.</p>"
          Link: { text: "Learn Our Mission", href: "https://www.o-i.com/", linktype: "external" }
        imageFields:
          - field: "Image"
            src: "https://www.o-i.com/wp-content/uploads/2023/03/Mask-group2-jpg.webp"
            alt: "Gloved hands holding recycled glass cullet"

  - position: 5
    componentName: "PromoCta"
    manifestName: "PromoCta"
    itemName: "OI Power of Glass"
    templateId: "c0943942-ae0f-4205-86fa-84884cce4a53"
    fields:
      Title: "Power of Glass Packaging"
      Text: "<p>Glass is pure, sustainable, and the kindest packaging material for the health of people and the planet. Glass has an element of magic to it. It is beautiful and iconic. It can turn into shapes. It plays with the senses. Glass is 100% recyclable and infinitely recyclable. It does not increase ocean pollution. Glass is virtually inert, which means it doesn't interact with the foods and beverages it holds.</p><p>We love glass and we aspire to create a healthier, more sustainable, and more exciting world through glass packaging.</p>"
      Link: { text: "Discover Benefits of Glass", href: "https://www.o-i.com/", linktype: "external" }
    imageFields:
      - field: "Image"
        src: "https://www.o-i.com/wp-content/uploads/2023/03/Rectangle-4637-jpg.webp"
        alt: "Hand holding an amber glass bottle"

