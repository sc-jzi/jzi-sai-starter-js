    kind: "simple"
    sectionBackground: "dark"
    content:
      Title: "Power of Glass Packaging"
      Text: "Glass is pure, sustainable, and the kindest packaging material for the health of people and the planet. Glass has an element of magic to it. It is beautiful and iconic. It can turn into shapes. It plays with the senses. Glass is 100% recyclable and infinitely recyclable. It does not increase ocean pollution. Glass is virtually inert, which means it doesn't interact with the foods and beverages it holds. We love glass and we aspire to create a healthier, more sustainable, and more exciting world through glass packaging."
      Link: { text: "Discover Benefits of Glass", href: "https://www.o-i.com/" }
    contentNotes: "Second Promo CTA instance — re-wire. Bottle photo in Image. Watermark is variant chrome, not a field."
    variantReason: "Need image-left plus the oversized OI mark; Default is image-right banking."

