      datasourceTemplateId: "c7b8468f-4290-400f-93bb-d46c5f8db126"
      variant: "OI"
      matchType: "template"
      matchConfidence: "high"
      variantMatch: "none"
      apiAddable: true
      customVariantNeeded:
        name: "OI"
        description: "Dark split slides, gold eyebrow from first Text paragraph, gold circular badge CTA overlay on the photo, indicator dots only (no prev/next arrows). Carousel Item fields: Title, Text, Image, Link."
        parentComponent: "Carousel"
    kind: "list"
    sectionBackground: "dark"
    content:
      slides:
        - Title: "Shaping the Future Through Glass"
          Text: "<p>OUR VISION</p><p>We create iconic, healthy glass packaging so synonymous with brands, you recognize those brands by their packaging alone, even without a label. We innovate packaging design to enable customers to meet their own ambitions, from connecting with consumers on an emotional level to creating a more sustainable future.</p>"
          Link: { text: "Learn Our Vision", href: "https://www.o-i.com/" }
        - Title: "Driven Through Innovation"
          Text: "<p>INNOVATION</p><p>Innovation and transformation are in our DNA. O-I Glass was founded more than a century ago by a man whose glass bottle making machine was called the most significant invention in glass in 2000 years. Founder Michael J. Owens' motto was \"It can be done.\" And we're doing it.</p>"
          Link: { text: "Learn Our Story", href: "https://www.o-i.com/" }
        - Title: "Our Sustainability Vision"
          Text: "<p>OUR MISSION</p><p>Glass is the ideal packaging material to support a low-waste, circular economy. But sustainability isn't just about what we make – it's also about how we make it. Sustainability is woven into everything we do, from transforming our glass-making technology and processes to our customer approach to how we engage our employees and support our communities.</p>"
          Link: { text: "Learn Our Mission", href: "https://www.o-i.com/" }
    contentNotes: "Re-wire existing Home Carousel (3 items). Carousel Item has no Eyebrow — first <p> in Text is the gold uppercase eyebrow. Headless Variants container for Carousel must be created."
    variantReason: "Default Carousel is a full-bleed banking hero with arrows; O-I is a dark split-panel slider with gold circular CTAs and dots."

