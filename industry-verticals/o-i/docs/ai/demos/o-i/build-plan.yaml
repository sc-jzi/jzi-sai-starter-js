    kind: "simple"
    sectionBackground: "dark"
    content:
      Title: "Innovation. Transformation. Glass Packaging."
      Text: "Glass is a material unlike any other, capable of creating stunning, memorable experiences, and it's the most sustainable packaging material on earth. At O-I, we have a history of transforming how the world stores food and beverages — of making glass more accessible to more customers and consumers. We reimagine how glass is made and sold by innovating production techniques, pioneering recycling and sustainable technology, and unleashing the iconic, brand-building potential of this packaging that is the kindest material for the planet and its people."
      Cta1: { text: "Read Our Story", href: "https://www.o-i.com/" }
      Cta2: { text: "More and Stories", href: "https://www.o-i.com/" }
    contentNotes: "No single hero photo — the 2x2 news grid is the visual. Generic variants will stack under/above the cards. Pixel-perfect can use the hero-banner placeholder for the Four Column CTA."
    variantReason: "Default Hero Banner is banking split with dotted accents and a single image."

  - position: 4
    description: "Carousel — three slides (Vision, Innovation, Sustainability Mission). Each slide is copy left / photo right on dark ground with a gold circular CTA badge on the image and pagination dots centered below."
