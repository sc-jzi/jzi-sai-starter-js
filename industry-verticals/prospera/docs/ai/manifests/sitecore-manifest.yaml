# Sitecore AI Manifest — Prospera base app
# Registry of the Sitecore items (renderings, templates, datasource folders, variants) that belong to the SHARED project layer
# of the base site. Reused as-is by every customer site; only NEW components are added later.
#
# This file starts EMPTY on purpose. It is not generated from code: it is filled by
#   1. /demo-inventory-base-site  (read-only discovery of the live base site via Marketer MCP + harness/scripts/inventory-components.mjs), and
#   2. the sitecore-create-* skills, which append an entry through /sitecore-maintain-manifest whenever they add a component.
# /sitecore-validate-manifest re-syncs it with live Sitecore. Do not hand-edit except to correct drift (add a `notes` field).

generatedAt: ""
lastUpdatedAt: ""
lastUpdatedBy: ""

project:
  siteCollection: ""            # base site collection  (docs/ai/config/project.yaml)
  siteName: ""                  # base site name
  sdk: "@sitecore-content-sdk/nextjs"
  renderingsRoot: ""            # e.g. /sitecore/layout/Renderings/Project/<layer>
  projectTemplatesRoot: ""      # e.g. /sitecore/templates/Project/<layer>

components: []`.
