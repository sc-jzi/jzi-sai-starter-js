    fields:
      Title1: "A Lifetime of Service, Honoured at Batoche"
      Text1: "Jul 17 — During the official opening of the 2026 Back to Batoche Days, Métis Nation–Saskatchewan introduced the President's Medal, a new honour recognizing exceptional service, leadership, and commitment to Métis citizens."
      Link1:
        text: "Read More"
        href: "https://mns.ca/news/newsroom/news/635/a-lifetime-of-service-honoured-at-batoche"
        target: ""
      Title2: "Taanishi aen Ishinihkaashooyen Li Pchi Bufloo? (What's Your Name, Little Buffalo?)"
      Text2: "Jul 6 — Meet our newest bison calves—now proudly named by Métis youth across Saskatchewan with names rooted in our languages and culture."
      Link2:
        text: "Read More"
        href: "https://mns.ca/news/newsroom/news/633/taanishi-aen-ishinihkaashooyen-li-pchi-bufloo-what-s-your-name-little-buffalo"
        target: ""
      Title3: "People of the Horse"
      Text3: "Jun 26 — Métis people have always shared a deep respect and historical connection with horses. Their uncanny ability to tame a wild horse and train the animal for hunting and transportation has earned them the title ‘People of the Horse’."
      Link3:
        text: "Read More"
        href: "https://mns.ca/news/newsroom/news/634/people-of-the-horse"
        target: ""
      Title4: "Economic Opportunities Expand with Federal Recognition"
      Text4: "Jun 15 — “It’s no secret that Indigenous people - there are very successful businesses here in Saskatchewan however what doors are open for them?” MN–S Minister of Economic Development Marg Friesen"
      Link4:
        text: "Read More"
        href: "https://mns.ca/news/newsroom/news/632/economic-opportunities-expand-with-federal-recognition"
        target: ""
    children: []
