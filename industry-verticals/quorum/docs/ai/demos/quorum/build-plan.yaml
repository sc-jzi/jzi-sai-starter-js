assembly:
  strategy: "Add the approved sequence to Home, wire new Quorum datasources, and retire the existing starter composition from the visible page."
  existingPageComponentCount: 10
  note: "The Agent API has no delete-component operation; existing starter renderings may require manual removal if they cannot be safely reused."
  datasourcePolicy:
    promosRoot: "/sitecore/content/utilities/quorum/Data/Promos"
    folderTemplateId: "8fe7f8dc-cb5d-42c2-99f8-76608c243f10"
    rule: "Store every CTA-style datasource in its component-specific child folder under Promos; create missing component folders with the Promo Folder template."
