validationNotes:
  - "projectTemplatesRoot corrected to /sitecore/templates/Project/Financial with user approval."
  - "Financial starter stores component and folder templates under the Components root."
  - "Legacy uiim manifest component definitions reference missing local React files; use the Financial starter component library for this demo."
  - "The Content SDK component maps were regenerated and include KalTireFinderHero and KalTirePromoMosaic."
  - "Custom components compile and pass TypeScript; production prerender is blocked by the existing missing discoverDomainId environment configuration."
  - "Layout reads were failing because the Agent API derives sc_site from the site display name; 'Kal Tire' could not resolve to the site 'kal-tire'. Fixed by setting __Display name to 'kal-tire' on the site root item {51AE7E42-770D-48C3-88D2-8DD0CC16592E}."
  - "Every Agent API write to an existing page returns HTTP 500 with no CM exception logged; confirmed on Home and /personal. Phase 6 must be completed manually in Pages."
  - "A page created via create_page accepted the same writes, so the failure is scoped to pre-existing pages rather than the site or renderings. The temporary test page was deleted at the user's request."
  - "OrcaBearerAuthentication issuer warning is Agent API log noise that also appears on successful calls; it is not the cause of the 500s."
  - "add_component_on_page creates its local datasource before failing, leaving orphans under /Home/Data that block retries with a duplicate-name error."
  - "Three Column CTA and Article List already exist on the Home page from the Financial starter and should be reused rather than re-added."
