# GBTS SXA component registry
# Visual matching catalog for demo builds on /sitecore/content/education/gbts.

components:
  - id: eyebrow
    name: "Eyebrow"
    manifestName: "Eyebrow"
    kind: context-only
    category: Navigation
    priority: 1
    variants: [Default]
    visualKeywords: [utility bar, phone bar, language selector, top strip]

  - id: header
    name: "Header"
    manifestName: "Header"
    kind: context-only
    category: Navigation
    priority: 2
    variants: [Default, WithLogoImage]
    visualKeywords: [logo with navigation, site header, menu bar]
    variantSelectionHints:
      Default: "text brand treatment"
      WithLogoImage: "client logo image is visible"

  - id: hero
    name: "Hero"
    manifestName: "Hero"
    kind: simple
    category: Page Content
    priority: 3
    variants: [Default]
    visualKeywords: [full-width hero image, centered headline, text overlay, hero CTA]

  - id: hero-banner
    name: "Hero Banner"
    manifestName: "HeroBanner"
    kind: simple
    category: Page Content
    priority: 4
    variants: [Default]
    visualKeywords: [split hero, image beside text, two hero CTAs]

  - id: heading-cta
    name: "Heading CTA"
    manifestName: "HeadingCta"
    kind: simple
    category: Page Content
    priority: 5
    variants: [Default, Compact, PageHeading, Centered]
    visualKeywords: [section heading, heading with button, centered intro, compact CTA]

  - id: promo-cta
    name: "Promo CTA"
    manifestName: "PromoCta"
    kind: simple
    category: Page Content
    priority: 6
    variants: [Default, WithPlaceholderColumn, WithBackgroundImage]
    visualKeywords: [split image CTA, promotional banner, background image CTA]

  - id: cta-banner
    name: "CTA Banner"
    manifestName: "CtaBanner"
    kind: simple
    category: Page Content
    priority: 7
    variants: [Default, LargeImage]
    visualKeywords: [wide CTA banner, text and large image, conversion banner]

  - id: two-column-cta
    name: "Two Column CTA"
    manifestName: "TwoColumnCta"
    kind: simple
    category: Page Content
    priority: 8
    variants: [Default]
    visualKeywords: [two cards, two columns, paired promotions]

  - id: three-column-cta
    name: "Three Column CTA"
    manifestName: "ThreeColumnCta"
    kind: simple
    category: Page Content
    priority: 9
    variants: [Default, WithIcons, WithIconsCompact]
    visualKeywords: [three cards, icon cards, three course categories]
    variantSelectionHints:
      Default: "image-led three-column cards"
      WithIcons: "large colored icons above card copy"
      WithIconsCompact: "dense icon cards with reduced spacing"

  - id: four-column-cta
    name: "Four Column CTA"
    manifestName: "FourColumnCta"
    kind: simple
    category: Page Content
    priority: 10
    variants: [Default]
    visualKeywords: [four cards, four promotions, four-column grid]

  - id: five-column-cta
    name: "Five Column CTA"
    manifestName: "FiveColumnCta"
    kind: simple
    category: Page Content
    priority: 11
    variants: [Default]
    visualKeywords: [five promotions, five course cards, enrollment grid]

  - id: features
    name: "Features"
    manifestName: "Features"
    kind: simple
    category: Page Content
    priority: 12
    variants: [Default]
    visualKeywords: [benefits section, feature list, why choose us, icon benefits]

  - id: testimonials
    name: "Testimonials"
    manifestName: "Testimonials"
    kind: list
    category: Page Content
    priority: 13
    variants: [Default]
    visualKeywords: [customer quotes, testimonial carousel, reviews]

  - id: quote
    name: "Quote"
    manifestName: "Quote"
    kind: simple
    category: Page Content
    priority: 14
    variants: [Default, Simple]
    visualKeywords: [single customer quote, attribution, testimonial card]

  - id: parallax-banner
    name: "Parallax Banner"
    manifestName: "ParallaxBanner"
    kind: simple
    category: Page Content
    priority: 15
    variants: [Default]
    visualKeywords: [photo background section, dark image overlay, benefits on image]

  - id: accordion
    name: "Accordion"
    manifestName: "Accordion"
    kind: list
    category: Page Content
    priority: 16
    variants: [Default]
    visualKeywords: [expandable list, collapsible courses, FAQ]

  - id: rich-text
    name: "Rich Text"
    manifestName: "RichText"
    kind: simple
    category: Page Content
    priority: 17
    variants: [Default]
    visualKeywords: [formatted copy, bullet list, body content]

  - id: footer
    name: "Footer"
    manifestName: "Footer"
    kind: simple
    category: Navigation
    priority: 99
    variants: [Default, WithSocials]
    visualKeywords: [site footer, legal links, copyright, social icons]
