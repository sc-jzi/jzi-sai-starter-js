    - { name: "impactYellow", value: "#D0DF00" }
    - { name: "printBlue", value: "#0C3471" }
    - { name: "printGreen", value: "#64A70B" }

typography:
  headingFamily: "'Barlow Condensed', sans-serif"
  headingWeight: "300"
  bodyFamily: "'Barlow', sans-serif"
  bodyWeight: "400"
  monoFamily: "'Barlow', monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap"
  scale:
    hero: "3.5rem"
    h1: "3.125rem"
    h2: "3.75rem"
    h3: "3.125rem"
    body: "1.25rem"
    small: "0.875rem"
  headingTransform: "uppercase"
  letterSpacing: "0.04em"
  lineHeight: "relaxed"

spacing:
  density: "spacious"
  sectionGap: "4rem"
  containerMaxWidth: "1440px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0px"
  buttonRadius: "0px"
  cardRadius: "6px"
  imageRadius: "0px"
  shadowStyle: "none"
  borderStyle: "none"

tone:
  overall: "corporate"
  colorMode: "mixed"
  contrast: "high"
  imagery: "photography"
  heroStyle: "full-bleed-image"
  cardStyle: "image-top"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#09244F"
      secondary: "#006E96"
      accent: "#4F8309"
  fontFamily:
    heading: ["Barlow Condensed", "sans-serif"]
    body: ["Barlow", "sans-serif"]
  borderRadius:
    DEFAULT: "0px"
    button: "0px"
    card: "0.375rem"

cssVariables: |
  :root {
    --brand-primary: #09244F;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #006E96;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #4F8309;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #464747;
    --brand-muted: #F4F4F4;
    --brand-muted-fg: #464747;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #09244F;
    --brand-footer-bg: #09244F;
    --brand-footer-fg: #ffffff;
    --brand-border: #D8DDE3;
    --brand-ring: #4F8309;
    --brand-heading-font: 'Barlow Condensed', sans-serif;
    --brand-body-font: 'Barlow', sans-serif;
    --brand-radius: 0px;
    --brand-button-radius: 0px;
    --brand-card-radius: 0.375rem;
  }

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Live pool-spa page uses the same web/ADA palette as pentair.com (Blue #09244F, Green #4F8309)."
    - "Scraper computed footer rgb(9,36,79) and CTA rgb(79,131,9) — matches official brand web colors."
    - "Headings use Barlow Condensed weight 300, uppercase. Body uses Barlow 400 at 20px. Both are on Google Fonts."
    - "Buttons are sharp rectangles (0px radius) with green fill and white uppercase text."
    - "Header is a solid white bar: utility icon row + Pentair Pool wordmark + Products / Education / Support + search."
    - "Hero is full-bleed pool-water photography with centered white uppercase overlay (no CTA on the live hero)."
    - "Secondary teal #006E96 is used for Pool Solutions bands, icon outlines, and some section accents."
    - "Product cards are image-top with green Learn More buttons. Category blocks alternate image/text."
    - "Footer is navy (#09244F) with white type. Nav is solid-bar (not transparent overlay)."
    - "Downloaded logo: docs/ai/themes/pentair-pool/images/logo.svg (Pentair Pool primary digital logo)."
