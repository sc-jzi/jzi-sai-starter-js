  sourceUrl: "https://www.pentair.com/en-us/pool-spa.html"
  extractedAt: "2026-08-25T21:45:00Z"
  extractedBy: "cursor"

colors:
  primary: "#09244F"
  primaryForeground: "#ffffff"
  secondary: "#006E96"
  secondaryForeground: "#ffffff"
  accent: "#4F8309"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#464747"
  muted: "#F4F4F4"
  mutedForeground: "#464747"
  headerBackground: "#ffffff"
  headerForeground: "#09244F"
  footerBackground: "#09244F"
  footerForeground: "#ffffff"
  border: "#D8DDE3"
  ring: "#4F8309"
