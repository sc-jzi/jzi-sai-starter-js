    datasourceItemId: "bd22c25f-cd78-452f-8966-3aa7c1bb5d96"
    apiAddable: true
    fields: {}
    children:
      - name: "Walden University - FAQ Accredited"
        fields:
          Title: "Is Walden University accredited?"
          Content: "<p>Walden University is accredited by the Higher Learning Commission (www.hlcommission.org), an institutional accreditation agency recognized by the U.S. Department of Education. Accreditation is a mark of quality. Walden has been accredited by the Higher Learning Commission (HLC) since 1990.</p>"
        imageFields: []
      - name: "Walden University - FAQ Online"
        fields:
          Title: "Does Walden offer fully online programs?"
          Content: "<p>Yes. Since 1970, Walden has supported working professionals in achieving their academic goals, initially through distance education and later online. Our flexible online learning environment features an accessible platform that lets you log in when it’s convenient for you, from wherever you are in the world.</p>"
        imageFields: []
      - name: "Walden University - FAQ Support"
        fields:
          Title: "What student support does Walden offer?"
          Content: "<p>When you enroll with us, you’re never alone. Walden’s student support services include Enrollment Specialists, a financial aid team, Academic Advisors, a career planning and development center, technical assistance, disability services, an online library, research support, an academic skills center, doctoral peer mentoring, and a writing center.</p>"
        imageFields: []
      - name: "Walden University - FAQ Transfer"
        fields:
          Title: "Can I transfer credits to Walden?"
          Content: "<p>Yes, you can transfer credits from other institutions to Walden. Speak to an Enrollment Specialist for a free transfer-of-credit evaluation by calling 1-866-492-5336.</p>"
        imageFields: []
    imageFields: []
    matchConfidence: "high"
