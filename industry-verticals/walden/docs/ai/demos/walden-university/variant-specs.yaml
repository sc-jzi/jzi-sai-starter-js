client: "Walden University"
variantNamePrefix: "Walden"

variantSpecs:
  - position: 1
    componentName: "Eyebrow"
    variantName: "Walden"
    baseVariant: "Default"
    visualDifferences:
      layout: "full-width utility strip"
      spacing: "tight vertical padding"
      typography: "12px white links"
      background: "dark teal --brand-primary"
      distinctive: "Apply Now lives in the right placeholder"

  - position: 2
    componentName: "Header"
    variantName: "Walden"
    baseVariant: "WithLogoImage"
    visualDifferences:
      layout: "logo left, nav + gold CTA right"
      typography: "uppercase 13px nav, Noto Serif logo"
      background: "solid white"
      buttons: "gold pill Request Information"

  - position: 3
    componentName: "Hero"
    variantName: "Walden"
    baseVariant: "Default"
