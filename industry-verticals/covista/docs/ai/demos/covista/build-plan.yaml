  - "Home page Title is still 'PLAY! Financial'. Phase 6 will reuse Home and note leftover banking pages for cleanup."
  - "PLAY! renderings live under /sitecore/layout/Renderings/Project/Financial. /sitecore/layout/Renderings/Project/covista has no children."
  - "UIIM datasource folders do not exist under covista/Data. New datasources go in Data/Promos (itemId 9a0b6c45-35d4-44a2-936e-331cb38ee37a) unless the rendering query requires a named folder (Stats Counter, CTA Banner, Heading CTA)."
