  - "get_component for Carousel returns 404 on the Verticals branch — same limitation as MN-S. Template IDs resolved via path."
  - "ArticleList was considered for News but has no Promo-folder datasource (page-as-datasource). FourColumnCta is the pipeline-safe match."
  - "Content Hub host https://covista.sitecoresandbox.cloud authenticated 200 OK."
