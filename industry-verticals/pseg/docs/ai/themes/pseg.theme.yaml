    --brand-header-bg: #002F6C;
    --brand-header-fg: #ffffff;
    --brand-footer-bg: #001F3D;
    --brand-footer-fg: #E8EEF4;
    --brand-border: #D8DEE6;
    --brand-ring: #002F6C;
    --brand-heading-font: 'Source Sans 3', Helvetica, Arial, sans-serif;
    --brand-body-font: 'Source Sans 3', Helvetica, Arial, sans-serif;
    --brand-radius: 0.25rem;
    --brand-button-radius: 0.25rem;
    --brand-card-radius: 0.25rem;
