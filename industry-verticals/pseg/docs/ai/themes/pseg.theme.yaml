extraction:
  confidence: "medium"
  method: "screenshot-analysis"
  notes:
    - "Playwright scraper not run — theme from screenshot + official brand research + DOM extract of nj.pseg.com."
    - "Official logo orange is Vivid Tangelo #F37022 (PMS 158 C). BrandColorCode lists #F35E19 as an alternate orange."
    - "nj.pseg.com UI is navy-dominant (utility bar, LOGIN button, energy banner), not the logo's raisin black. Primary navy set to #002F6C to match the screenshot."
    - "Footer is a deeper navy (#001F3D) than the header utility bar."
    - "Source Sans 3 is already loaded by the Financial starter (site-financial) and is a close match for PSEG's clean humanist sans."
    - "Buttons and cards are nearly square (2–4px radius), not pills. Cards use light gray borders more than drop shadows."
    - "Hero is a dark navy gradient with a geometric glow, not a full-bleed photo — tone.heroStyle is gradient."
    - "Phase 4 will map these tokens onto site-financial CSS variables in src/assets/sass/abstracts/vars/_colors.scss (and a PSEG overlay stylesheet)."
