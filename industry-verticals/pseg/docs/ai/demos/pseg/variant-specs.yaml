    visualDifferences:
      layout: "Dark navy utility bar above a white brand bar. Logo left, icon shortcuts right, Sitecore nav on a second row."
      spacing: "Utility bar compact; brand bar ~14px vertical padding; nav row bordered on top."
      typography: "Utility links 12px uppercase; shortcuts 11px uppercase; nav 15px semibold navy."
      background: "Utility #001F3D; brand bar white with light bottom border."
      buttons: "None — text/icon links only."
      distinctive: "PAY BILL / OUTAGE / MY ACCOUNT / SAVINGS & ENERGY icon row matching nj.pseg.com."

  - position: 2
    componentName: Carousel
    variantName: Pseg
    baseVariant: Default
    visualDifferences:
      layout: "Two-column hero plus a persistent login card on the right. Slide copy left, award/photo center."
      spacing: "Section padding 2.5rem 0 3.5rem; login card 22rem wide."
      typography: "Hero headline clamp 1.75–2.6rem white; CTA is an underlined text link, not a filled button."
      background: "Navy radial glow over #002F6C → #001F3D gradient. Not a full-bleed photo."
      buttons: "Login solid navy; Register outlined navy on a white card."
      distinctive: "Static Login/Register card is chrome, not a Sitecore field. No real authentication."

