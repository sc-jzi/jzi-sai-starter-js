    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: |
        <div class="ck-content"><h3><strong>History carried forward</strong></h3><p>&nbsp;When horses were introduced to North America in the late 1600’s, Indigenous people quickly developed a profound connection to the animals. The Métis became incredibly adept riders, bareback marksmen, and hunters. The taming and training methods are still used today. That relationship to the horse is why Métis were bestowed with the title ‘People of the Horse’.</p><p>“In Cree, we call them mistatim…that means big dog. We used to use dogs for carrying goods around, teepees and stuff like that.”</p><figure><p><img src="https://mns.ca/uploads/public/Screenshot%202026-06-18%20at%2011.00.25%E2%80%AFAM.png" alt="Screenshot 2026-06-18 at 11.00.25 AM.png (763 KB)" width="748" height="830" /></p></figure><p>Elder Ivor Wayne Burns has almost a visceral response when he speaks of the magnificent animals. He’s been working with horses since he was six years old and says he learned his taming techniques from his father and grandfather.</p><p>“We didn’t buck them out, we broke them with kindness. We broke them with trust and loving. They have no trust for you, they have no loyalty for you. You have to earn that trust and that loyalty from a horse. When they got close enough to us, we breathed into their nostrils. They can smell trust, kindness, caring and sharing. When they trust you, then they’re easy to work with.”</p><p>At age 14, Elder Burns was wagon racing – then came his life-long passion for the Indian Relay. Having seen wins and losses over the span of his career, the now 71-year-old watches his grandsons heat up the track and bring home the buckles. He’s passed along what he learned so many years ago from his grandfather and is a mainstay at the annual Batoche festival.</p><h3><strong>New events bring more excitement to Batoche</strong></h3><p>Mounted shooting is a new addition to the cultural and sporting lineup, bringing time-honoured Métis horsemanship to modern-day competition. During the traditional buffalo hunt, Métis marksmen relied on their highly trained horses to run into a chaotic herd, leaving their hands free to load and shoot their long guns at a full gallop. That deep connection between man and horse can still be seen at Batoche.</p><figure><p><img src="https://mns.ca/uploads/public/Mounted%20shooting.jpg" alt="Mounted shooting.jpg (19 KB)" width="315" height="230" /></p></figure><p>“It’s fun to bring an old west tradition into a modern new building.”</p><p>President of the Saskatchewan Cowboy Mounted Shooting Association (SCMSA), Lucas Thiessen says mounted shooting dates back to the Batoche resistance and a fighting tactic of Gabrielle Dumont’s. Thiessen believes the tradition became sport in the 80’s.</p><p>“There was group of them in Arizona, and they started setting up bottles in cactuses in the desert and we use blank ammunition now but when they started, they were using live ammunition and they would run through the desert and shoot bottles out of cactuses…..I tried it and I went home and ordered a set of guns to use in it.”</p><p>Raised in a horse training family himself, Lucas started riding competitively 12 years ago. Today, he’s among the elite riders running the course in under nine seconds. Interestingly, the sport is dominated by women. Thiessen watches his 4-year-old daughter, Remi ride, shooting with her cap gun. Mounted shooting is on the decline in Canada, because Canadian gun laws ban the import and sale of six shooters, even without ammunition.</p><p><i><strong><em>Watch and listen as Lucas Thiessen describes Mounted Shooting</em></strong></i> <a href="https://youtu.be/R_j8Idz8LC0">here.&nbsp;</a></p><p>Both Indian Relay and Mounted Shooting showcase the traditional Métis “running start” technique, a practice that originated during the historic bison hunt. Métis hunters would wait for the official signal before charging at full gallop into the herd. Remove the bison, and the concept closely resembles flat racing – another new event featured at the Vermette Racetrack in Batoche. Flat racing typically relies on Thoroughbreds, horses renowned for their speed and stamina, while success also depends on the skill, strength, and strategy of their riders.</p><figure><p><img src="https://mns.ca/uploads/public/20230721_123611.jpg.jpeg" alt="20230721_123611.jpg.jpeg (4.04 MB)" width="4000" height="3000" /></p></figure><p><i><em>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;MN–S Environment Director and Batoche track lead w/family at Batoche 2025</em></i></p><p>Batoche track lead, Brent Laroque said, “After every festival, events are assessed and new events are considered for potential adds the next time. Flat racing and Mounted Shooting are based on Métis culture, not to mention the fact they’re action packed. So, it’s a great way to enhance the Batoche experience and grab the attention of the kids. They’re the next generation and it gives them a new appreciation of their history.”</p><p>With the excitement at the Vermette Raceway kicking up another notch, you won’t want to miss a minute of the action. See you at the track!</p><h3>Vermette Raceway Schedule – Back to Batoche Days 2026</h3><h3>(all times are weather reliant)</h3><p><br /><strong>Thursday July 16</strong></p><p>2pm - NWSCCA Chariots</p><p>4pm - NWSCCA Chuckwagons</p><p>6pm - CPCA Chuckwagons</p><p><strong>Friday July 17</strong></p><p>12:30pm - NWSCCA Chariots</p><p>2:30pm - NWSCCA Chuckwagons</p><p>4:30pm - Flat Races</p><p>5:00pm - Mounted Shooting</p><p>6:00pm - CPCA Chuckwagons</p><p>7:30pm - Indian Relay</p><p><strong>Saturday July 18</strong></p><p>12:30pm - NWSCCA Chariots</p><p>2:30pm - NWSCCA Chuckwagons</p><p>4:30pm - Flat Races</p><p>5:30pm - CPCA Chuckwagons</p><p>7:00pm - Indian Relay</p><p><strong>Sunday July 19</strong></p><p>1:00pm CPCA Chuckwagons</p><p>2:30pm CPCA Award Ceremony</p><p>3:00pm Flat Races</p><p>3:00pm Indian Relay</p><p>For complete Back to Batoche details, go to <a href="https://mns.ca/news/newsroom/news/634/backtobatoche.ca.">backtobatoche.ca.</a></p></div>
