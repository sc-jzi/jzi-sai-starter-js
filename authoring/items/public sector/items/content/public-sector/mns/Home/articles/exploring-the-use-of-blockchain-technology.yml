    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: |
        <div class="ck-content"><figure><p><img src="https://mns.ca/uploads/public/Screenshot%202026-06-11%20at%203.57.35%E2%80%AFPM.png" alt="Screenshot 2026-06-11 at 3.57.35 PM.png (1.22 MB)" width="814" height="922" /></p></figure><p><i><em>Economic Development Minister Marg Friesen discusses the PSIB</em></i></p><p>Prior to 2019, the Métis Nation–Saskatchewan (MN–S) government didn’t have a dedicated Economic Development Ministry. That changed when MN–S and Canada signed the Métis Recognition and Self-Government (MRSG) agreement that June: Economic development was recognized as a priority.</p><p>“With our federal partners, we want to build out economic opportunities for Métis citizens in Saskatchewan in industry, technology, education and skills training, and culture, with the procurement strategy Canada has,” said MN–S Minister of Economic Development Marg Friesen.</p><p>Two years ago, MN–S introduced the SaskMétis Works registry for Métis business. Today, 328 are on the list. Applying businesses must pass the rigorous vetting process that’s been established by the MN–S Registry. In May, the Government of Canada officially recognized the MN–S business registry as a certified source of Saskatchewan businesses.</p><figure><p><img src="https://mns.ca/uploads/public/MNS%20EcDev-Seals-Certified.jpg" alt="MNS EcDev-Seals-Certified.jpg (765 KB)" width="2400" height="2400" /></p></figure><p><i><em>Official seal of the MN–S SaskMétis Works registry</em></i></p><p>Minister Friesen said the administrative barriers faced by Indigenous business are beginning to fade. “It creates a space specifically for Métis entrepreneurs removing those barriers of applying or bidding on opportunities or tenders that existed in the past. Now that they’ve registered with SaskMétis Works it enables them to skip that step and go right into identifying what tenders they can access directly with that procurement strategy nationally. The opportunities abound and we need to highlight those individuals, and they need to know who we are so that we can support them ideally and support them realistically in developing their business vision so they can be successful.”&nbsp;</p><p>The federal Procurement Strategy for Indigenous Businesses (PSIB) in 1996 and revised in 2021. It includes a minimum 5% Indigenous involvement in federal contracts which can have significant, positive impact in Saskatchewan. In the fiscal 2023-24 year, a total $1.24 billion in federal contracts was awarded to Indigenous businesses. The Indigenous Business Directory (IBD) supports this initiative by serving as a publicly accessible platform to determine whether Indigenous businesses meet the PSIB’s eligibility criteria, with businesses consenting to audits designed to preserve the program’s integrity.</p><p>The recognition unlocks the economic potential to build a brighter future for MN–S businesses by reducing systemic barriers, advancing reconciliation, and bringing expansion opportunities closer to reality for Métis business owners.&nbsp;</p><h3><strong>Prince Albert Security Services</strong></h3><p>Prince Albert Security Services employs well over 100 people and has operating since 2020. Owner Roger Reimer says, “The majority of the work we do is local, but we do travel across Saskatchewan, and we do a little work in Saskatoon as well with our sister company Stryke Protection Services Ltd. It too is on the registry too and we use that company to target more corporately and also give people options on pricing I like the idea of giving our clients options and realistically we can travel Canada wide.”</p><figure><p><img src="https://mns.ca/uploads/public/Screenshot%202026-06-12%20at%208.44.24%E2%80%AFAM.png" alt="Screenshot 2026-06-12 at 8.44.24 AM.png (5.30 MB)" width="2210" height="1512" /></p></figure><p><i><em>file courtesy - PA Security Services website</em></i></p><p>Reimer said being a part of the national registry removes an obstacle we may have faced previously because we’ve already been recognized as a certified Métis business. He believes the opportunities for expansion are now endless.</p><p>“Our small Saskatchewan business will be seen in a more professional light with this type of national recognition. There are some 900 security businesses in Saskatchewan alone and this federal recognition can help us stand out from the others. It’s a big deal for us. As a business owner, I’m providing for my family. Our employees are providing for theirs. We want to compete on federal contracts to provide opportunities for those who need work.”</p><p>Reimer knows because his business is on the SaskMétis Works registry, he’s already been certified Métis, meaning if a contractor or company is shopping for sub-contractors on the Indigenous Business Registry, they know the companies are cleared to bid on the work.</p><h3><strong>Synergy Construction</strong></h3><p>100% owned Synergy Construction is based in Regina. Mike Hansen says his company has already been vetted by the federal government but to have a distinct, Métis seal cuts out the middle person.</p><figure><p><img src="https://mns.ca/uploads/public/90e31a5c-1225-497c-9605-0ce18c5fa533.jpg.jpeg" alt="90e31a5c-1225-497c-9605-0ce18c5fa533.jpg.jpeg (123 KB)" width="640" height="481" /></p></figure><p><i><em>Synergy Construction build&nbsp;</em></i></p><p>“There was a time other companies wouldn’t take Métis businesses seriously,” Mike said. “We’re fortunate that we knew about the federal Indigenous Business Directory early on but there can be a lot of hurdles to jump over if you don’t know where to go.”</p><p>While SaskMétis Works provides a one-stop shop for owners looking for tender opportunities or who are available for subcontracting, some tweaks still need to be made to ensure the registered businesses still qualify for the seal down the line. MN–S Economic Development is working with the business community to assess the registry and make the necessary adjustments to align with the federal process.</p><h3><strong>Register your Métis-owned business</strong></h3><p>If you are a Métis-owned business in Saskatchewan not currently registered with SaskMétis Works, sign up today at https://saskmetisworks.ca/. &nbsp;If you would rather meet in person, the Economic Development team will be at Back to Batoche Days in July as well to help you out.&nbsp;</p><p>Listen to a conversation about the federal recognition of the MN–S business registry with Economic Development director Reagan Harding and MN–S Minister of Economic Development Marg Friesen&nbsp;<a href="https://youtu.be/CwfKpTBJL6Q">here.</a></p></div>
