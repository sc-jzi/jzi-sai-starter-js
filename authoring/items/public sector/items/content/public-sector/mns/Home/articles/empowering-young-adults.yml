  - ID: "b5e02ad9-d56f-4c41-a065-a133db87bdeb"
    Hint: __Display name
    Value: "The MN-S Government Effect Citizen Successes"
  Versions:
  - Version: 1
    Fields:
    - ID: "001dd393-96c5-490b-924a-b0f25cd9efd8"
      Hint: __Lock
      Value: <r />
    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: |
        <div class="ck-content"><p>37-year-old Métis citizen Spenser Thibault is raising three, going on four, children in Warman. He’s able to do that more comfortably in the house he bought with the First Time Home Buyers program. He also just finished retrofitting his home with solar panels and new doors that keep the harsh Saskatchewan winters out with the Home Efficiency Initiative (HEI). He’s already seeing a return with electrical bills $70 less than they were a year ago.&nbsp;</p><figure><p><img src="https://mns.ca/uploads/public/Spenny.jpg" alt="Spenny.jpg (1.96 MB)" width="3507" height="4761" /></p></figure><p>Spenser said, “I can't believe I have solar power helping me cut down the cost of my monthly electric bill. It's unreal. You guys at the MN–S have done so much for me. Not just with this but with everything else. So thank you, really. You've helped me get into my home, keep it efficient and affordable, so that I can raise my kids in it and provide a loving environment for them. When I put my kids to bed at night, they don't tell me they love me in English - they tell me – ki shaakihitin. They say this to each other too. I want you to know your work and your programs have effectively resulted in providing us with a home in which we can raise our children with the bits of culture we have, and my oldest child proudly proclaims she is a Michif already.”</p><figure><p><img src="https://mns.ca/uploads/public/Adrienne%20HEI%2024972.aUUelee09VFNFpJprskI_height640.png" alt="Adrienne's home with retrofits from HEI" width="361" height="480" /></p></figure><p><i><em>Adrienne Reinson stands proudly in front of her retrofitted home in Regina</em></i></p><p>Adrienne Reinson and her family participated in the first round of the Home Efficiency Initiative (HEI), and she said, “The impact has been truly life changing.”</p><p>“My family would never have been able to afford solar or energy efficiency improvements. This opportunity has been incredible. We ended up making 3100 Kwh our first year, approximately 1200 kg of CO2 emissions saved.&nbsp; We just hit our first year with Solar on March 13th!”&nbsp;</p><p>With new windows, doors, and solar upgrades, Adrienne has noticed a considerable different in heating and cooling. She’s delighted to be using clean energy and hopes more families can access similar opportunities in the future.&nbsp;</p><p>A dedicated early childhood educator, Adrienne runs Little Lilies Childcare in Regina. In 2022, she was honored with the Métis Early Childhood Educator Certificate of Recognition for outstanding work in early learning and childcare.&nbsp;</p><p>“We are proud to be part of the Métis Nation and encourage everyone to look into the amazing programs offered. It’s inspiring to have a government that truly cares about its citizens and makes real change.”&nbsp;</p><p>The MN–S government offers several programs for new and existing Métis homeowners. Stay on top of what’s new and find out what's available to you now by visiting <a href="https://mns.ca/mns-government/departments-ministries/housing-and-homelessness">https://mns.ca/mns-government/departments-ministries/housing-and-homelessness.</a></p></div>
