      Hint: Question
      Value: 退職後の生活設計はどのように始めればよいのでしょうか？
    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: リタイアメント・プランニングの旅を始めるには、まず現在の財務状況を評価し、リタイアメントの目標を考えることから始めよう。 次に、私どものアドバイザーにご相談いただき、お客様のニーズに合った退職プランをお作りください。
