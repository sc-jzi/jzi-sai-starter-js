        <div class="ck-content"><h2>Elder Joanna Potiyondi and Gerald Morin receive the first-ever MN–S President's Medals&nbsp;<br />Some people shape our Nation through a single act. Others spend a lifetime doing it.</h2><p>During the official opening of the 2026 Back to Batoche Days, Métis Nation–Saskatchewan (MN–S) introduced the President's Medal, a new honour recognizing exceptional service, leadership, and commitment to Métis citizens.</p><p>In presenting the inaugural awards, MN–S President Glen McCallum said the President's Medal was created to celebrate those whose contributions reflect the strength, resilience, culture, values, and vision of the Métis Nation. The honour recognizes individuals whose life's work has left a lasting mark on the Nation and continues to inspire future generations.</p><p>The first-ever President's Medals, presented as Lifetime Achievement Awards, were awarded to Elder Joanna Potiyondi and Gerald Morin.</p><h3>Elder Joanna Potiyondi&nbsp;</h3><p><br />A respected Elder, Culture Keeper, poet, and community leader, Joanna Potiyondi has dedicated her life to preserving and sharing Métis culture, values, and traditions. Raised in Roche Percée, Saskatchewan, by grandparents born during the Métis Resistance, she carries a deep connection to Métis history, the land, and the horse culture that grew out of the buffalo hunt.</p><p><br />As President of Local 15 in Melville, she is marking an extraordinary 50 years of service in 2026. Through her leadership and storytelling, Elder Potiyondi continues to pass Métis knowledge to future generations and keep the spirit of the Métis Nation strong.</p><p>Gerald Morin&nbsp;<br />Gerald Morin has spent more than three decades advancing the rights and aspirations of the Métis Nation. Raised in the Métis community of Green Lake, Saskatchewan, he built a distinguished career as a lawyer, advocate, and leader, serving as President of both Métis Nation–Saskatchewan and the Métis National Council.</p><p><br />Among the earliest champions of Métis self-government and rights recognition, Morin helped shape important advances in Métis governance, harvesting rights, and Nation-building. His lifelong dedication has left a lasting impact on Métis citizens and continues to inspire current and future generations of leaders.&nbsp;</p></div>
