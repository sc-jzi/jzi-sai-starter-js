    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: |
        <div class="ck-content"><div><section><article><div><div><div><div><h2>What Are PFAS?</h2><p>PFAS are a series of thousands of laboratory-made chemicals that take a <a href="https://www.epa.gov/pfas/pfas-explained" target="_blank" rel="noopener noreferrer" title="long time to break down."><strong>long time to break down.</strong></a> They help make nonstick pans, grease-resistant food packaging, and waterproof clothing work. They also come from firefighting foam, cosmetics, and industrial manufacturing activities.</p><p>Because of their widespread use in numerous industrial and consumer products, it's not uncommon to find PFAS in drinking water, including public water systems and private water wells.&nbsp;</p><p><a href="https://www.pentair.com/en-us/home-water-treatment/resources/education/water-filtration-for-pfas.html"><strong>What are PFAS in water?</strong></a> Learn more in our comprehensive guide.</p></div></div><div><div><h2>Why Should You Avoid PFAS?</h2><p>According to the CDC Agency for Toxic Substances and Disease Registry, scientific studies have shown that exposure to some PFAS in the environment may be linked to harmful health effects in humans and animals. Several peer-reviewed scientific studies have found a link between PFAS and fertility, certain cancers, and hormonal issues. For many people, avoiding PFAS can bring peace of mind, especially since so much is still uncertain about their long-term effects.</p></div></div><div><div><h2>How to Address PFAS in Your Home Water?</h2><p>The U.S. Environmental Protection Agency has established drinking water standards for several PFAS compounds, helping utilities and communities address PFAS contamination over time.</p></div></div><div><div><h2>Effective Water Filtration Options</h2><p>When looking for filtration solutions, it’s helpful to choose products certified to meet recognized standards for contaminant reduction. Certification means the product has been tested and proven to reduce specific substances, including PFAS.</p><p>Here are some filtration options designed to help reduce PFAS in your home water:</p></div></div></div></div></article></section></div><div><section><article><div><div><div><div><h3>For Undersink filtration</h3></div></div></div></div></article></section></div><div><section><article><div><div><div><figure><p><a href="https://www.pentair.com/en-us/home-water-treatment/under-sink-filtration-systems/freshpoint-easy-flow-undercounter-filtration-system.html"><img src="https://pentair.scene7.com/is/image/pentair/pentair-easy-flow-front?wid=190&amp;hei=190&amp;fmt=webp&amp;fit=fit&amp;qlt=90,0&amp;resMode=sharp2&amp;bgc=F7F7F7" alt="Pentair Easy Flow Product Image Front" width="190" height="190" loading="lazy" /></a></p></figure><figure><p><a href="https://www.pentair.com/en-us/home-water-treatment/under-sink-filtration-systems/freshpoint-3-stage-undercounter-filtration-system.html"><img src="https://pentair.scene7.com/is/image/pentair/fp-f3000-b2b-faucet?wid=190&amp;hei=190&amp;fmt=webp&amp;fit=fit&amp;qlt=90,0&amp;resMode=sharp2&amp;bgc=F7F7F7" alt="FreshPoint F3000-B2B " width="190" height="190" /></a></p></figure><figure><p><a href="https://www.pentair.com/en-us/home-water-treatment/under-sink-filtration-systems/freshpoint-2-stage-undercounter-filtration-system.html"><img src="https://pentair.scene7.com/is/image/pentair/fp-f2000-b2b-faucet?wid=190&amp;hei=190&amp;fmt=webp&amp;fit=fit&amp;qlt=90,0&amp;resMode=sharp2&amp;bgc=F7F7F7" alt="FreshPoint F2000-B2B" width="190" height="190" /></a></p></figure></div></div><div><div><div><div><h4><a href="https://www.pentair.com/en-us/home-water-treatment/under-sink-filtration-systems/freshpoint-easy-flow-undercounter-filtration-system.html"><strong>Freshpoint Easy Flow</strong></a></h4><p>Certified for PFOA and PFOS (two common PFAS chemicals), this system offers a high capacity of 3,000 gallons and a practical flow rate, making it great for everyday use. Its fine 0.5-micron filter helps catch tiny particles for reliable filtration.</p></div></div><div><div><h4><a href="https://www.pentair.com/en-us/home-water-treatment/under-sink-filtration-systems/freshpoint-3-stage-undercounter-filtration-system.html"><span><strong>Freshpoint F3000 3-Stage</strong></span></a></h4><p>Certified for PFAS reduction, this multi-stage system also tackles other contaminants like microplastics. It balances capacity and flow rate well, making it a solid choice for comprehensive water care.</p></div></div><div><div><h4><a href="https://www.pentair.com/en-us/home-water-treatment/under-sink-filtration-systems/freshpoint-2-stage-undercounter-filtration-system.html"><strong>Freshpoint F2000 2-Stage</strong></a></h4><p>Also certified for PFAS reduction, this slightly smaller system is ideal if you want effective filtration with a compact setup. It also helps reduce other chemicals like atrazine.</p></div></div></div></div></div></article></section></div><div><section><article><div><div><div><div><h3>For whole-home filtration</h3></div></div></div></div></article></section></div><div><section><article><div><div><div><figure><p><a href="https://www.pentair.com/en-us/home-water-treatment/filter-replacements/floplus-protect-20bb-cartridge.html"><img src="https://pentair.scene7.com/is/image/pentair/floplus-protect-20bb-system?wid=200&amp;hei=200&amp;fmt=webp&amp;fit=fit&amp;qlt=90,0&amp;resMode=sharp2&amp;bgc=F7F7F7" alt="2000 x 2000 px FloPlus Protect 20 BB System" width="200" height="200" /></a></p></figure></div></div><div><div><div><div><h4><a href="https://www.pentair.com/en-us/home-water-treatment/filter-replacements/floplus-protect-20bb-cartridge.html"><strong>FloPlus Protect System 20BB</strong></a></h4><p>Certified for PFAS reduction, this system handles a large volume of water with a high flow rate, making it suitable for filtering water throughout your entire home.</p></div></div></div></div></div></article></section></div><div><section><article><div><div><div><div><h2>What you can do next</h2><p>Learn more about PFAS and next steps you can take in our other blog post, <a href="https://www.pentair.com/en-us/home-water-treatment/resources/education/water-filtration-for-pfas.html.html"><strong>PFAS in Drinking Water, What You Need to Know.&nbsp;</strong></a></p></div></div></div></div></article></section></div></div>
