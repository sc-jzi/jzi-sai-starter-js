    - ID: "3e700dce-26eb-4bf0-990f-9d9fe555990d"
      Hint: Excerpt
      Value: |
        The term per- and polyfluoroalkyl substances, also known as PFAS, is a mouthful — literally. These small, manmade chemicals are nearly everywhere — including our water. PFAS in drinking water are present in all 50 states. Yikes.
        
        If you're worried about these forever chemicals, use our guide to learn how to avoid PFAS in your home water.
        
