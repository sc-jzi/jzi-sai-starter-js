    - ID: "cc0cb595-ce5c-413e-b413-3a7176347f28"
      Hint: Text
      Value: <p>Everpure and Manitowoc Ice from Pentair Water Solutions have each won a 2025 Kitchen Innovations Award from the National Restaurant Association.</p><p>Everpure’s PFOA/PFOS Reduction Systems were awarded for their ability to reduce PFAS in water. Manitowoc Ice was recognized for its innovative NEO ice machine, the industry’s pioneering commercial undercounter ice machine with an integrated water filtration system.</p>
