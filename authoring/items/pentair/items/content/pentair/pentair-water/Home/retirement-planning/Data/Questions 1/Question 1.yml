    - ID: "93ba0221-aa2a-4a04-b8f6-39c2ab65c694"
      Hint: Question
      Value: 既存の組織からの移籍は簡単ですか？
    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: 問題ありません！ 私たちはいつもそうしています。 既存の退職金制度を移行するには、当社と現在のプロバイダーに解約通知を送付してください。 あとは私たちが調整し、プロセス全体を通して最新情報をお知らせします。
