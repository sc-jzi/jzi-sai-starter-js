    - ID: "93ba0221-aa2a-4a04-b8f6-39c2ab65c694"
      Hint: Question
      Value: "How easy is it to transfer from an existing organization?"
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
      Hint: __Updated by
      Value: |
        sitecore\johannes.zijlstra@sitecore.com
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260828T132848Z
    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: |
        No problem! We do it all the time.
        
        To transfer an existing retirement plan, send a termination notice to us and your current provider. We'll coordinate the rest and keep you updated throughout the entire process.
- Language: "fr-CA"
  Versions:
  - Version: 1
    Fields:
