    - ID: "cc0cb595-ce5c-413e-b413-3a7176347f28"
      Hint: Text
      Value: "<p>Pentair Water Solutions is committed to improving water, no matter the source. We work together, day in, day out, to provide trusted, great tasting, life sustaining water and ice. Through our water solutions, <strong>since 2021 over 23.7 billion single-use plastic</strong> water bottles were avoided by customers using Pentair residential water filtration systems. This is only the beginning. Join us in our journey to improve the world's water, eliminate waste and do our part to help people and planet thrive.</p>"
